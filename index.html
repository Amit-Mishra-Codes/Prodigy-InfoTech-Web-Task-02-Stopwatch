<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch | Prodigy InfoTech Task 2</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><p class="eyebrow">PRODIGY INFOTECH · WEB DEVELOPMENT TASK 02</p><h1>Stopwatch</h1><p class="subtitle">Every second counts. Track your time with precision.</p></header>
<section class="card"><p class="status"><span id="dot"></span><span id="status">Ready when you are</span></p><div id="display" class="time">00:00.00</div><div class="labels"><span>MINUTES</span><span>SECONDS</span><span>HUNDREDTHS</span></div>
<div class="controls"><button id="start" class="primary">▶ Start</button><button id="pause" disabled>Ⅱ Pause</button><button id="lap" disabled>＋ Lap</button><button id="reset" disabled>↺ Reset</button></div>
<div class="stats"><div><small>LAPS</small><strong id="count">0</strong></div><div><small>BEST LAP</small><strong id="best">—</strong></div></div></section>
<section class="history"><div class="heading"><h2>Lap History</h2><button id="clear" class="clear" disabled>Clear laps</button></div><p id="empty">Your lap times will appear here.</p><ol id="laps"></ol></section><footer>Built with HTML, CSS &amp; JavaScript · Prodigy InfoTech Internship</footer></main><script src="script.js"></script></body></html>
